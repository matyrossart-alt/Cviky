<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moje cviky</title>
<meta name="theme-color" content="#fbf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moje cviky">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fbf7f2; --card:#ffffff; --text:#2b2a27; --muted:#6f6b63; --line:#ece6dc; --warn:#9a5b10;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#18171a; --card:#232127; --text:#f1ede6; --muted:#aaa49a; --line:#37343b; --warn:#f0b866; }
}
/* barvy sekcí: c = sytá barva, t = světlý podklad, d = tmavý text na podkladu */
.k-coral {--c:#e0603a;--t:#fde6dc;--d:#7a2a12}
.k-teal  {--c:#1a9e80;--t:#d9f3ea;--d:#0b4f40}
.k-amber {--c:#e8960c;--t:#fdefcf;--d:#6e4300}
.k-purple{--c:#7b62d9;--t:#e9e4fd;--d:#36277c}
.k-pink  {--c:#d64f86;--t:#fde1ec;--d:#76193f}
.k-red   {--c:#e0434a;--t:#fde0e1;--d:#7c1519}
.k-blue  {--c:#2f80d1;--t:#dcebfb;--d:#0d3d6e}
.k-green {--c:#4f9a24;--t:#e4f3d6;--d:#264d0c}
.k-indigo{--c:#4a5bd1;--t:#e1e5fb;--d:#1f2a73}
.k-cyan  {--c:#0f97ad;--t:#d6f1f6;--d:#064a56}
.k-yellow{--c:#c99a00;--t:#fbf3c4;--d:#5c4600}
.k-brown {--c:#a5643a;--t:#f5e6db;--d:#55301a}
.k-lime  {--c:#6f9e0f;--t:#eef6d2;--d:#384f05}
@media (prefers-color-scheme: dark){
  .k-coral {--c:#f08a66;--t:#4a2418;--d:#ffd9cb}
  .k-teal  {--c:#4cc9a8;--t:#143a31;--d:#c8f3e5}
  .k-amber {--c:#f5b442;--t:#43300a;--d:#ffe6b3}
  .k-purple{--c:#a28ff0;--t:#2c2453;--d:#e2dbff}
  .k-pink  {--c:#ef7fab;--t:#4a1a2f;--d:#ffd6e6}
  .k-red   {--c:#f27378;--t:#4a1a1c;--d:#ffd6d8}
  .k-blue  {--c:#6aaef0;--t:#15304d;--d:#d3e7fd}
  .k-green {--c:#8fcf5e;--t:#22371a;--d:#dcf3c8}
  .k-indigo{--c:#8c98f2;--t:#22284f;--d:#dde1ff}
  .k-cyan  {--c:#4fcbe0;--t:#11353c;--d:#cdf3fa}
  .k-yellow{--c:#f2cf3d;--t:#3d3410;--d:#fff1b8}
  .k-brown {--c:#d4936a;--t:#3d2618;--d:#f7dcca}
  .k-lime  {--c:#b5dc4f;--t:#2c3612;--d:#eaf7c4}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:28px;font-weight:700;margin:8px 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--t);border:none;border-radius:18px;padding:16px;text-align:left;color:var(--d);
  font:inherit;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  border-bottom:5px solid var(--c)}
.tile:active{transform:scale(.97)}
.tile .ico{font-size:30px;line-height:1}
.tile .name{font-size:16px;font-weight:700}
.tile .count{font-size:13px;opacity:.85}
.tile.fav{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.head{background:var(--t);color:var(--d);border-radius:18px;padding:14px 16px 16px;margin-bottom:16px}
.head h1{margin:2px 0 4px;font-size:24px}
.head p{margin:0;font-size:15px;opacity:.9}
.back{background:none;border:none;color:var(--d);font:inherit;font-size:16px;font-weight:600;padding:4px 0;cursor:pointer}
.ex{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;position:relative}
.ex h3{margin:0 0 4px;font-size:17px;font-weight:700;padding-right:44px}
.ex p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.ex .tag{display:inline-block;font-size:12px;font-weight:600;background:var(--t);color:var(--d);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.heart{position:absolute;top:8px;right:8px;width:40px;height:40px;border:none;background:none;cursor:pointer;
  font-size:24px;line-height:1;color:var(--muted)}
.heart.on{color:#e0434a}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;text-decoration:none;
  padding:10px 14px;border-radius:10px;font-size:15px;font-weight:700}
@media (prefers-color-scheme: dark){ .play{color:#141216} }
.none{font-size:13px;color:var(--warn);align-self:center}
.yt{font-size:14px;color:var(--c);text-decoration:none;font-weight:600;padding:10px 4px}
.empty{background:var(--t);color:var(--d);border-radius:14px;padding:16px;font-size:15px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <h1>Moje cviky</h1>
    <p class="sub">Vyber partii a pusť si video ke cviku.</p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="detail" class="hidden">
    <div class="head" id="dHead">
      <button class="back" id="back">‹ Zpět</button>
      <h1 id="dTitle"></h1>
      <p id="dSub"></p>
    </div>
    <div id="dList"></div>
  </section>
</div>
<script>
/* ===== DATA – sem se doplňují cviky a odkazy na videa ===== */
const SEKCE = [
  { id:"stred-tela", nazev:"Střed těla", ikona:"🎯", barva:"coral", popis:"Hluboký stabilizační systém, břicho a záda.", cviky:[
    {n:"Cviky na střed těla", p:"Příspěvek s obrázky cviků na střed těla.", v:"https://www.instagram.com/p/DYKzsR5CImB/?img_index=6&igsh=MWN6a3l0c2dmNjh1ZQ==", t:"Otevřít"},
    {n:"Trénink na břicho 15 min", p:"Břicho a hluboké stabilizační svaly vlastní vahou, důraz na správnou polohu těla a lopatek.", v:"https://youtu.be/Kkziosw9F2c?is=N36iyD2C7bvUx2_W"},
    {n:"Cvičení s overballem", p:"Barre cvičení s malým míčem na zpevnění, rovnováhu a výdrže v pozicích, 10 min (Barre Days).", v:"https://youtu.be/-F48W00tU2I?is=SPpBFB4oOCQhx06V"},
    {n:"Střed těla s overballem", p:"Krátké video: posílení středu těla s overballem.", v:"https://youtube.com/shorts/QmrP_kyLJw0?is=G1J3Oz1vds61cQP3"},
    {n:"Břicho s overballem", p:"Posilování břicha s malým měkkým míčem (overball).", v:"https://youtube.com/shorts/1R0KgOSnwsg?is=QnOo1a4sEzfHgu_v"},
  ]},
  { id:"chodidla", nazev:"Chodidla", ikona:"🦶", barva:"teal", popis:"Klenba, prsty a stabilita kotníku.", cviky:[
    {n:"Cviky na chodidla", p:"Video sestava cviků na chodidla.", v:"https://www.facebook.com/share/r/1C7tQtop2V/?mibextid=wwXIfr"},
    {n:"Cviky na chodidla 2", p:"Další video sestava cviků na chodidla.", v:"https://www.facebook.com/share/r/1BmytvVgzp/?mibextid=wwXIfr"},
    {n:"Cviky na chodidla 3", p:"Další video sestava cviků na chodidla.", v:"https://www.facebook.com/share/r/19VnnXv2bg/?mibextid=wwXIfr"},
    {n:"Cviky na chodidla 4", p:"Další video sestava cviků na chodidla.", v:"https://www.facebook.com/share/r/1EvT1QJN3D/?mibextid=wwXIfr"},
  ]},
  { id:"zpevneni", nazev:"Celkové zpevnění", ikona:"💪", barva:"amber", popis:"Posilování celého těla vlastní vahou.", cviky:[
    {n:"Posilování vlastní váhou", p:"Video sestava cviků s vlastní vahou.", v:"https://www.facebook.com/share/r/19V9ffEVGn/?mibextid=wwXIfr"},
    {n:"Cvičení s vlastní vahou s trenérem", p:"Krátký domácí trénink, který krok za krokem vede trenér (Fitshaker).", v:"https://youtu.be/ZGDcwqaufXw?is=m-DFpG1mu9WnqvZI"},
    {n:"Posilování těla", p:"Příspěvek s obrázky posilovacích cviků.", v:"https://www.instagram.com/p/DWPZwEKiFYJ/?img_index=6&igsh=MWI0YjBmbTd4c2l0NA==", t:"Otevřít"},
  ]},
  { id:"sm-system", nazev:"SM systém", ikona:"🌀", barva:"purple", popis:"Spirální stabilizace páteře s lanem.", cviky:[
    {n:"Kompletní cvičení SM systému se Smíškem", p:"YouTube kanál Spiral Stabilization s kompletním cvičením SM systému.", v:"https://youtube.com/@spiralstabilizationofficial?si=shHV0WWxVN4dAwqi", t:"Otevřít kanál"},
    {n:"SM systém – začátečníci 1", p:"Úvodní lekce SM systému pro začátečníky.", v:"https://youtu.be/l1mnIGD3RbQ?is=8QGN7rcppaFQHRIj"},
    {n:"SM systém – cvik 1", p:"První cvik základní sestavy SM systému.", v:"https://youtu.be/0EkAGVXCri0?is=yjYBkp4DKfX5cpr5"}
  ]},
  { id:"joga", nazev:"Jóga", ikona:"🧘", barva:"pink", popis:"Základní pozice pro protažení a dech.", cviky:[
    {n:"Pozdrav slunci – 8 ásan", p:"Plynulá sestava osmi pozic s dechem.", v:"https://www.facebook.com/share/r/19YTxifjz9/?mibextid=wwXIfr"},
    {n:"Harmonizace čaker", p:"Jógová sestava pro harmonizaci čaker.", v:"https://www.facebook.com/share/r/17fASGD85S/?mibextid=wwXIfr"},
    {n:"Kanál @yogalifehappylife", p:"YouTube kanál s jógovými videi.", v:"https://youtube.com/@yogalifehappylife?si=zr-KdY0ZIaKZaAja", t:"Otevřít kanál"},
    {n:"Ranní jóga 22 min", p:"Energizující ranní jóga pro start dne, pro středně pokročilé (StillOnTheWay).", v:"https://youtu.be/EgrQ8be2dtU?is=AsNnaMgrOtARCPe1"},
    {n:"Jógová sestava", p:"Video s jógovou sestavou.", v:"https://www.instagram.com/reel/DSkSVq1lK75/?igsh=N21jNHAwYXdtMmJu"},
    {n:"Jógová sestava 2", p:"Další video s jógovou sestavou.", v:"https://www.facebook.com/share/r/1AVjGrueSc/?mibextid=wwXIfr"},
  ]},
  { id:"protahovani", nazev:"Protahování", ikona:"🤸", barva:"blue", popis:"Uvolnění a protažení svalů.", cviky:[
    {n:"Protahování", p:"Video sestava protahovacích cviků.", v:"https://www.facebook.com/share/r/1b13iJEqxH/?mibextid=wwXIfr"},
    {n:"Protahování 2", p:"Další video sestava protahovacích cviků.", v:"https://www.facebook.com/share/r/1BuEfiHfeJ/?mibextid=wwXIfr"}
  ]},
  { id:"dech", nazev:"Dechová cvičení", ikona:"🌬️", barva:"green", popis:"Práce s dechem pro zklidnění a energii.", cviky:[
    {n:"Dechová cvičení", p:"Video s dechovými cvičeními.", v:"https://www.facebook.com/share/r/1EiJuafW4q/?mibextid=wwXIfr"}
  ]},
  { id:"krk", nazev:"Krk", ikona:"🦒", barva:"indigo", popis:"Uvolnění a posílení krční páteře.", cviky:[
    {n:"Cviky na krk", p:"Video sestava cviků na krk.", v:"https://www.facebook.com/share/r/1KBVCdhq5v/?mibextid=wwXIfr"},
    {n:"Cviky na krk 2", p:"Příspěvek s obrázky cviků na krk.", v:"https://www.instagram.com/p/DUk5ScPjLpm/?img_index=3&igsh=dDk0OTdya2Rtanp3", t:"Otevřít"},
    {n:"Cviky na krk 3", p:"Další příspěvek s obrázky cviků na krk.", v:"https://www.instagram.com/p/DU8gXaeiNtK/?img_index=5&igsh=MXRzdnN0bXQxMmlpaw==", t:"Otevřít"}
  ]},
  { id:"drzeni-tela", nazev:"Držení těla", ikona:"🧍", barva:"cyan", popis:"Vzpřímené a vyrovnané držení těla.", cviky:[
    {n:"Cviky na držení těla", p:"Video sestava cviků pro správné držení těla.", v:"https://www.facebook.com/share/r/18xcnVESLb/?mibextid=wwXIfr"},
    {n:"Cviky na držení těla 2", p:"Další video pro správné držení těla.", v:"https://www.instagram.com/reel/DUoI1FFCKCU/?igsh=N3c5andtc2h5N3Jx"}
  ]},
  { id:"energeticke", nazev:"Energetické cviky", ikona:"⚡", barva:"yellow", popis:"Cviky pro dodání energie a probuzení těla.", cviky:[
    {n:"Energetické cviky", p:"Video sestava energetických cviků.", v:"https://www.facebook.com/share/r/18uMLmcpLJ/?mibextid=wwXIfr"},
    {n:"Tancování v sedě", p:"Rozhýbání celého těla tancem vsedě.", v:"https://www.facebook.com/share/r/1CZd2Hh3a2/?mibextid=wwXIfr"},
    {n:"Taneční kroky", p:"Video s tanečními kroky.", v:"https://www.instagram.com/reel/DRskChxAZ1o/?igsh=eDJ3b2U2dmp5ejZs"},
    {n:"Taneční kroky 2", p:"Další video s tanečními kroky.", v:"https://www.instagram.com/reel/DS7D12DDI7h/?igsh=ank4ZTV6MHVjbmc="}
  ]},
  { id:"guma", nazev:"Posilování s gumou", ikona:"🪢", barva:"brown", popis:"Cviky s odporovou gumou Thera-Band.", cviky:[
    {n:"Cvičení s gumou Thera-Band", p:"Playlist 17 videí s cviky s odporovou gumou (Rehasport).", v:"https://youtube.com/playlist?list=PLLKgBrT4ZFNartsBTSx6ailbhxzkN7QCv&si=E0vbbipVAQZuxo1J", t:"Otevřít playlist"},
    {n:"5 základních cviků s odporovou gumou", p:"Krátký trénink: 5 cviků po 20 s, 3 série (Venira).", v:"https://youtu.be/05XcQFbUQBY?is=o4T4NNTh8LsEU0Sq"}
  ]}
];
/* ===== konec dat ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pocet = n => n===1 ? "1 cvik" : (n>=2 && n<=4 ? n+" cviky" : n+" cviků");
const zdroj = url => /facebook\.com|fb\.watch/.test(url) ? " (Facebook)" : /youtu/.test(url) ? " (YouTube)" : /instagram\.com/.test(url) ? " (Instagram)" : "";

/* oblíbené – ukládají se v tomto prohlížeči */
const KEY = "mojeCviky.oblibene";
let fav = new Set();
try { fav = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const saveFav = () => { try { localStorage.setItem(KEY, JSON.stringify([...fav])); } catch(e) {} };
const klic = (s, c) => s.id + "|" + c.n;

function oblibene(){
  const out = [];
  SEKCE.forEach(s => s.cviky.forEach(c => { if (fav.has(klic(s,c))) out.push({s, c}); }));
  return out;
}

function home(){
  const f = oblibene().length;
  $("grid").innerHTML =
    `<button class="tile fav k-red" data-id="oblibene"><span class="ico" aria-hidden="true">❤️</span>
      <span><span class="name">Oblíbené</span><br><span class="count">${f ? pocet(f) : "zatím nic – přidej srdíčkem"}</span></span></button>` +
    SEKCE.map(s =>
    `<button class="tile k-${s.barva}" data-id="${s.id}"><span class="ico" aria-hidden="true">${s.ikona}</span>
     <span><span class="name">${esc(s.nazev)}</span><br><span class="count">${s.cviky.length ? pocet(s.cviky.length) : "připravuje se"}</span></span></button>`
  ).join("");
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}

function karta(s, c, ukazSekci){
  const k = klic(s,c), on = fav.has(k);
  return `<div class="ex k-${s.barva}">
    ${ukazSekci ? `<span class="tag">${s.ikona} ${esc(s.nazev)}</span>` : ""}
    <h3>${esc(c.n)}</h3><p>${esc(c.p)}</p>
    <button class="heart${on ? " on" : ""}" data-k="${esc(k)}" aria-label="${on ? "Odebrat z oblíbených" : "Přidat do oblíbených"}">${on ? "♥" : "♡"}</button>
    <div class="btns">${c.v
      ? `<a class="play" href="${esc(c.v)}" target="_blank" rel="noopener">${c.t ? "↗ " + esc(c.t) : "▶ Přehrát video"}${zdroj(c.v)}</a>`
      : `<span class="none">Video zatím chybí</span><a class="yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(c.n+" cvik")}" target="_blank" rel="noopener">Hledat na YouTube ›</a>`}
    </div></div>`;
}

function render(){
  const id = location.hash.replace("#","");
  const s = SEKCE.find(x => x.id === id);
  const jeFav = id === "oblibene";
  const detail = !!s || jeFav;
  $("home").classList.toggle("hidden", detail);
  $("detail").classList.toggle("hidden", !detail);
  if (!detail){ home(); return; }
  $("dHead").className = "head k-" + (jeFav ? "red" : s.barva);
  if (jeFav){
    const list = oblibene();
    $("dTitle").textContent = "❤️ Oblíbené";
    $("dSub").textContent = "Tvoje vybrané cviky ze všech sekcí.";
    $("dList").innerHTML = list.length ? list.map(x => karta(x.s, x.c, true)).join("")
      : `<div class="empty k-red">Zatím tu nic není. U cviku klepni na srdíčko ♡ a objeví se tady.</div>`;
  } else {
    $("dTitle").textContent = s.ikona + " " + s.nazev;
    $("dSub").textContent = s.popis;
    $("dList").innerHTML = s.cviky.length ? s.cviky.map(c => karta(s, c, false)).join("")
      : `<div class="empty k-${s.barva}">Cviky SM systému doplníme podle tvých videí. Stačí poslat název cviku a odkaz.</div>`;
  }
  document.querySelectorAll(".heart").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    fav.has(k) ? fav.delete(k) : fav.add(k);
    saveFav();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
}
$("back").onclick = () => { location.hash = ""; render(); window.scrollTo(0,0); };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
