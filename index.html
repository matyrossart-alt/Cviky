<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#faf6f0;color:#2b3d5b;color-scheme:light;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:30px;font-weight:700;margin:6px 0 4px;letter-spacing:-.3px;color:#2b3d5b}
.head h1{color:var(--tx)}
.head > div:last-child{position:relative;z-index:1}
.sub{color:#8a7f70;font-size:15px;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;border:none;border-radius:22px;padding:16px;text-align:left;
  background:var(--c);font:inherit;cursor:pointer;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile::after{content:"";position:absolute;right:-28px;bottom:-28px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:28px;height:28px}
.tile .name{font-size:16px;font-weight:700;line-height:1.25;position:relative;z-index:1}
.tile .count{font-size:13px;opacity:.85;position:relative;z-index:1}
.tile.fav{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.head{background:var(--c);color:var(--tx);border-bottom:4px solid #c49a3e;min-height:150px;border-radius:22px;padding:14px 18px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-end;position:relative;overflow:hidden}
.head .hc{font-size:14px;opacity:.85;margin-top:2px}
.head .ic{position:relative;z-index:1;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;flex:none}
.head .ic svg{width:32px;height:32px}
.head h1{font-size:24px;margin:0}
.back{background:none;border:none;color:#7a756d;font:inherit;font-size:16px;font-weight:600;padding:4px 0 10px;cursor:pointer}
.ex{background:#fff;border-radius:18px;border:1px solid #efe6d8;padding:16px;margin-bottom:10px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ex h3{margin:0 0 4px;font-size:17px;font-weight:700;padding-right:40px}
.ex p{margin:0;color:#7a756d;font-size:15px;line-height:1.45}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#b8893a;margin-bottom:4px}
.heart{position:absolute;top:10px;right:10px;width:40px;height:40px;border:none;background:none;cursor:pointer;font-size:24px;line-height:1;color:#c9c3ba}
.heart.on{color:#d08f8e}
.row{display:flex;align-items:center;gap:14px;margin-top:12px}
.go{border:none;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--tx);
  text-decoration:none;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:700}
.ext{font-size:14px;color:#7a756d;text-decoration:none}
.player{margin-top:12px;border-radius:14px;overflow:hidden;background:#000;border:1px solid #efe6d8}
.player iframe{display:block;width:100%;border:0}
.player .fb{display:block;background:#fff;color:#2b3d5b;text-decoration:none;font-size:14px;font-weight:600;padding:10px 12px;text-align:center;border-top:1px solid #efe6d8}
.player.wide iframe{aspect-ratio:16/9}
.player.tall{max-width:340px;margin-left:auto;margin-right:auto}
.player.tall iframe{aspect-ratio:9/16}
.player.ig iframe{height:620px;background:#fff}
.empty{background:#fff;border-radius:18px;padding:18px;font-size:15px;line-height:1.5;color:#7a756d}
html:has(body.tinted){background:var(--bgt)}
body{min-height:100vh}
body.tinted{background-color:var(--bgt);background-image:var(--vzor);background-size:100px 100px;background-attachment:fixed}
.head{background-image:var(--hvzor);background-size:84px 84px}
#detail{position:relative;z-index:1}
.nove{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.75);color:#2b3d5b}
.novy{display:inline-block;vertical-align:middle;font-size:11px;font-weight:700;color:#b8893a;background:#f6ecd8;border-radius:999px;padding:2px 8px;margin-left:4px}
.hidden{display:none}
</style>

};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pocet = n => n===1 ? "1 cvik" : (n>=2 && n<=4 ? n+" cviky" : n+" cviků");
const zdroj = url => /facebook\.com|fb\.watch/.test(url) ? "Facebook" : /youtu/.test(url) ? "YouTube" : /instagram\.com/.test(url) ? "Instagram" : "web";

const NA = {Facebook:"na Facebooku", YouTube:"na YouTube", Instagram:"na Instagramu", web:"na webu"};
const KEY = "mojeCviky.oblibene";
let fav = new Set();
try { fav = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const saveFav = () => { try { localStorage.setItem(KEY, JSON.stringify([...fav])); } catch(e) {} };
const klic = (s, c) => s.id + "|" + c.n;
/* nová videa: při prvním spuštění se všechna stávající berou jako známá */
const KEY_ZN = "mojeCviky.znamaVidea";
let znama = null;
try { const z = localStorage.getItem(KEY_ZN); if (z) znama = new Set(JSON.parse(z)); } catch(e) {}
const vsechna = () => SEKCE.flatMap(s => s.cviky.map(c => c.v)).filter(Boolean);
if (!znama) { znama = new Set(vsechna()); try { localStorage.setItem(KEY_ZN, JSON.stringify([...znama])); } catch(e) {} }
const jeNove = c => c.v && !znama.has(c.v);
const prehrano = url => { if (!url || znama.has(url)) return; znama.add(url); try { localStorage.setItem(KEY_ZN, JSON.stringify([...znama])); } catch(e) {} };
const novych = n => n===1 ? "1 nové video" : (n<=4 ? n+" nová videa" : n+" nových videí");
const oblibene = () => { const o=[]; SEKCE.forEach(s => s.cviky.forEach(c => { if (fav.has(klic(s,c))) o.push({s,c}); })); return o; };

function embed(url){
  let m;
  if ((m = url.match(/youtube\.com\/playlist\?list=([\w-]+)/))) return {src:"https://www.youtube.com/embed/videoseries?list="+m[1], cls:"wide"};
  if ((m = url.match(/youtube\.com\/shorts\/([\w-]{6,})/))) return {src:"https://www.youtube.com/embed/"+m[1]+"?playsinline=1&rel=0", cls:"tall"};
  if ((m = url.match(/youtu\.be\/([\w-]{6,})/)) || (m = url.match(/[?&]v=([\w-]{6,})/))) return {src:"https://www.youtube.com/embed/"+m[1]+"?playsinline=1&rel=0", cls:"wide"};
  if ((m = url.match(/instagram\.com\/(reel|p)\/([\w-]+)/))) return {src:"https://www.instagram.com/"+m[1]+"/"+m[2]+"/embed", cls:"ig"};
  if (/facebook\.com\//.test(url)) return {src:"https://www.facebook.com/plugins/video.php?show_text=false&width=340&href="+encodeURIComponent(url), cls:"tall"};
  return null; /* kanály se otevírají na YouTube */
}

function vzor(id, barva, op){
  const ic = (IKONY[id]||"").replace(/stroke-width="2"/, 'stroke-width="1.6"');
  const kus = (x,y,r) => ic.replace("<svg ", `<svg x="${x}" y="${y}" width="30" height="30" `).replace('viewBox="0 0 24 24"', `viewBox="0 0 24 24" transform="rotate(${r} ${x+15} ${y+15})"`);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g color="${barva}" opacity="${op}">${kus(10,10,-12)}${kus(60,60,12)}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function home(){
  const f = oblibene().length;
  const tile = (id, nazev, count, extra, nove) =>
    `<button class="tile ${extra||""}" style="--c:${BARVY[id][0]};color:${BARVY[id][1]}" data-id="${id}">${nove ? `<span class="nove">● ${novych(nove)}</span>` : ""}<span class="ic">${IKONY[id]||""}</span>
     <span><span class="name">${esc(nazev)}</span><br><span class="count">${count}</span></span></button>`;
  $("grid").innerHTML = tile("oblibene","Oblíbené", f ? pocet(f) : "přidej srdíčkem ♡","fav") +
    SEKCE.map(s => tile(s.id, s.nazev, pocet(s.cviky.length), "", s.cviky.filter(jeNove).length)).join("");
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
}

function karta(s, c, ukazSekci){
  const k = klic(s,c), on = fav.has(k), e = embed(c.v), obr = !!c.t && /instagram/.test(c.v);
  const tlac = e
    ? `<button class="go pbtn" data-src="${esc(e.src)}" data-cls="${e.cls}" data-l="${obr ? "Zobrazit" : "▶ Přehrát"}">${obr ? "Zobrazit" : "▶ Přehrát"}</button>
       <a class="ext" href="${esc(c.v)}" target="_blank" rel="noopener">v aplikaci ${zdroj(c.v)} ↗</a>`
    : `<a class="go" href="${esc(c.v)}" target="_blank" rel="noopener">${c.t ? esc(c.t) : "▶ Přehrát"} ${NA[zdroj(c.v)]} ↗</a>`;
  return `<div class="ex" data-v="${esc(c.v)}">
    ${ukazSekci ? `<div class="tag">${esc(s.nazev)}</div>` : ""}
    <h3>${esc(c.n)}${jeNove(c) ? ` <span class="novy">nové</span>` : ""}</h3><p>${esc(c.p)}</p>
    <button class="heart${on ? " on" : ""}" data-k="${esc(k)}" aria-label="${on ? "Odebrat z oblíbených" : "Přidat do oblíbených"}">${on ? "♥" : "♡"}</button>
    <div class="row">${tlac}</div><div class="player hidden"></div></div>`;
}

function render(){
  const id = location.hash.replace("#","");
  const s = SEKCE.find(x => x.id === id), jeFav = id === "oblibene";
  const detail = !!s || jeFav;
  $("home").classList.toggle("hidden", detail);
  $("detail").classList.toggle("hidden", !detail);
  if (!detail){ document.body.classList.remove("tinted"); home(); return; }
  const kid = jeFav ? "oblibene" : s.id;
  const [bg, tx] = BARVY[kid];
  document.body.style.setProperty("--c", bg); document.body.style.setProperty("--tx", tx);
  document.body.style.setProperty("--bgt", "color-mix(in srgb, " + bg + " " + (tx === "#fff" && bg.startsWith("#2b") || bg.startsWith("#3e") ? "7" : "14") + "%, #fffdf9)");
  document.body.classList.add("tinted");
  document.body.style.setProperty("--vzor", vzor(kid, bg === "#2b3d5b" || bg === "#3e5478" ? bg : (tx === "#fff" ? bg : "#2b3d5b"), .13));
  $("dHead").style.setProperty("--hvzor", vzor(kid, tx, .16));
  $("dIc").innerHTML = IKONY[kid] || "";
  $("dCount").textContent = jeFav ? "" : pocet(s.cviky.length);
  $("dTitle").textContent = jeFav ? "Oblíbené" : s.nazev;
  if (jeFav){
    const list = oblibene();
    $("dList").innerHTML = list.length ? list.map(x => karta(x.s, x.c, true)).join("")
      : `<div class="empty">Zatím tu nic není. U cviku klepni na srdíčko ♡ a objeví se tady.</div>`;
  } else {
    $("dList").innerHTML = s.cviky.map(c => karta(s, c, false)).join("");
  }
  document.querySelectorAll(".pbtn").forEach(b => b.onclick = () => {
    const box = b.closest(".ex").querySelector(".player");
    const open = !box.classList.contains("hidden");
    document.querySelectorAll(".player").forEach(p => { p.innerHTML = ""; p.className = "player hidden"; });
    document.querySelectorAll(".pbtn").forEach(x => x.textContent = x.dataset.l);
    if (open) return;
    box.className = "player " + b.dataset.cls;
    const link = b.closest(".ex").querySelector(".ext");
    box.innerHTML = `<iframe src="${b.dataset.src}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share" allowfullscreen></iframe>
      <a class="fb" href="${link.href}" target="_blank" rel="noopener">Nejde přehrát? ${link.textContent.replace("v aplikaci","Otevřít v aplikaci")}</a>`;
    b.textContent = "■ Zavřít";
  });
  document.querySelectorAll(".ex").forEach(ex => ex.addEventListener("click", ev => {
    if (!ev.target.closest(".pbtn, a")) return;
    prehrano(ex.dataset.v); const t = ex.querySelector(".novy"); if (t) t.remove();
  }));
  document.querySelectorAll(".heart").forEach(b => b.onclick = () => {
    const k = b.dataset.k; fav.has(k) ? fav.delete(k) : fav.add(k); saveFav();
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
}
$("back").onclick = () => { location.hash = ""; render(); window.scrollTo(0,0); };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
